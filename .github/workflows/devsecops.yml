name: DevSecOps Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan & Save Report
        run: |
          gitleaks detect --source=. --report-format=json --report-path=gitleaks-results.json --verbose || true

      - name: Upload Gitleaks Results
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-security-report
          path: gitleaks-results.json
          retention-days: 7 

      - name: Add Gitleaks Job Summary with Findings
        run: |
          echo "### 🔐 Gitleaks Secret Detection Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s gitleaks-results.json ] && [ "$(cat gitleaks-results.json)" != "[]" ]; then
            echo "> ⚠️ **Warning:** Secrets or credentials detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | File | Line |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "| `\(.RuleID)` | `\(.File)` | `\(.StartLine)` |"' gitleaks-results.json | head -n 10 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ **Clean:** No secrets found in the codebase." >> $GITHUB_STEP_SUMMARY
          fi

  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config=auto --exclude=".github/workflows" --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep.sarif
          retention-days: 7

      - name: Add Semgrep Job Summary with Findings
        run: |
          echo "### 🛡️ Semgrep SAST Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s semgrep.sarif ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | File Path |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[0].results[]? | "| `\(.ruleId)` | `\(.locations[0].physicalLocation.artifactLocation.uri)` |\n"' semgrep.sarif | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No findings reported." >> $GITHUB_STEP_SUMMARY
          fi

  trivy-scan:
    name: Trivy Static & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.json
          retention-days: 7

      - name: Add Trivy Job Summary with Findings
        run: |
          echo "### 🐳 Trivy Static & Config Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Vulnerability ID | Package |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | "| **\(.Severity)** | `\(.VulnerabilityID)` | `\(.PkgName)` |\n"' trivy-results.json | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No vulnerabilities reported." >> $GITHUB_STEP_SUMMARY
          fi

  trivy-container-scan:
    name: Trivy Container Image Scan (Dynamic Category)
    runs-on: ubuntu-latest
    steps:
      - name: Pull DVWA Docker Image
        run: docker pull vulnerables/web-dvwa:latest

      - name: Run Trivy Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerables/web-dvwa:latest'
          format: 'json'
          output: 'trivy-container-results.json'
          exit-code: '0'

      - name: Upload Container Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-security-report
          path: trivy-container-results.json
          retention-days: 7

      - name: Add Trivy Container Job Summary
        run: |
          echo "### 📦 Trivy Container Image Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-container-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Vulnerability ID | Package |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | "| **\(.Severity)** | `\(.VulnerabilityID)` | `\(.PkgName)` |\n"' trivy-container-results.json | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No vulnerabilities reported in image." >> $GITHUB_STEP_SUMMARY
          fi

  sqlmap-dynamic-scan:
    name: SQL Injection Scan via Sqlmap (Dynamic Category)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start DVWA Container Locally
        run: |
          docker run -d -p 80:80 --name dvwa-app vulnerables/web-dvwa:latest
          sleep 15

      - name: Initialize DVWA Database Automatically
        run: |
          curl -s -X POST --data "create_db=Create+%2F+Reset+Database" http://127.0.0.1/setup.php > /dev/null
          sleep 3

      - name: Install Sqlmap and Python Requests
        run: |
          sudo apt-get update && sudo apt-get install -y sqlmap python3-requests

      - name: Run Python Auth & Sqlmap Scan with Redirect Bypass
        run: |
          python3 - << 'EOF'
          import requests
          import subprocess
          import re

          session = requests.Session()
          login_url = "http://127.0.0.1/login.php"
          
          # 1. Λήψη σελίδας σύνδεσης για το CSRF token
          resp = session.get(login_url)
          token_match = re.search(r"name='user_token' value='(.*?)'", resp.text)
          user_token = token_match.group(1) if token_match else ""
          print(f"Extracted user_token: {user_token}")

          # 2. Υποβολή διαπιστευτηρίων σύνδεσης
          payload = {
              "username": "admin",
              "password": "password",
              "Login": "Login",
              "user_token": user_token
          }
          session.post(login_url, data=payload)
          
          # 3. Ορισμός επιπέδου ασφαλείας DVWA
          session.cookies.set("security", "low")

          # Δημιουργία string cookies για το sqlmap
          cookie_str = "; ".join([f"{name}={value}" for name, value in session.cookies.items()])
          print(f"Active Session Cookies: {cookie_str}")

          # 4. Εκτέλεση sqlmap με το --ignore-redirects
          import os
          if os.path.exists("endpoints.txt"):
              with open("endpoints.txt", "r") as f:
                  endpoints = [line.strip() for line in f if line.strip() and not line.strip().startswith("#")]
              
              for ep in endpoints:
                  print(f"Testing endpoint: {ep}")
                  cmd = [
                      "sqlmap",
                      "-u", ep,
                      "--cookie", cookie_str,
                      "--dbms", "mysql",
                      "-p", "id",
                      "--ignore-redirects",
                      "--batch",
                      "--risk", "2",
                      "--level", "2",
                      "--output-dir", "sqlmap-out"
                  ]
                  subprocess.run(cmd)
          else:
              print("endpoints.txt not found!")
          EOF

      - name: Upload Sqlmap Results
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-security-report
          path: sqlmap-out/
          retention-days: 7

      - name: Add Sqlmap Job Summary
        run: |
          echo "### ⚡ Sqlmap SQL Injection Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Scan Status: **Completed**" >> $GITHUB_STEP_SUMMARY
          echo "- Target Endpoints: Checked via \`endpoints.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Sqlmap successfully completed dynamic security testing bypassing redirects." >> $GITHUB_STEP_SUMMARY