name: DevSecOps Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Εγκατάσταση του Gitleaks απευθείας στο Ubuntu runner
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      # 2. Εκτέλεση σκανάρισματος και αποθήκευση σε JSON
      - name: Run Gitleaks Scan & Save Report
        run: |
          gitleaks detect --source=. --report-format=json --report-path=gitleaks-results.json --verbose || true

      # 3. Αποθήκευση του αρχείου στα Artifacts του GitHub
      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-security-report
          path: gitleaks-results.json
          retention-days: 7