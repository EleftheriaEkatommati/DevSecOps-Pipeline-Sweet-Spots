name: DevSecOps Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan & Save Report
        run: |
          gitleaks detect --source=. --report-format=json --report-path=gitleaks-results.json --verbose || true

      - name: Upload Gitleaks Results
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-security-report
          path: gitleaks-results.json
          retention-days: 7 

      - name: Add Gitleaks Job Summary with Findings
        run: |
          echo "### 🔐 Gitleaks Secret Detection Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s gitleaks-results.json ] && [ "$(cat gitleaks-results.json)" != "[]" ]; then
            echo "> ⚠️ **Warning:** Secrets or credentials detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | File | Line |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "| `\(.RuleID)` | `\(.File)` | `\(.StartLine)` |"' gitleaks-results.json | head -n 10 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ **Clean:** No secrets found in the codebase." >> $GITHUB_STEP_SUMMARY
          fi

  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config=auto --exclude=".github/workflows" --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep.sarif
          retention-days: 7

      - name: Add Semgrep Job Summary with Findings
        run: |
          echo "### 🛡️ Semgrep SAST Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s semgrep.sarif ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | File Path |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[0].results[]? | "| `\(.ruleId)` | `\(.locations[0].physicalLocation.artifactLocation.uri)` |\n"' semgrep.sarif | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No findings reported." >> $GITHUB_STEP_SUMMARY
          fi

  trivy-scan:
    name: Trivy Static & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.json
          retention-days: 7

      - name: Add Trivy Job Summary with Findings
        run: |
          echo "### 🐳 Trivy Static & Config Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Vulnerability ID | Package |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | "| **\(.Severity)** | `\(.VulnerabilityID)` | `\(.PkgName)` |\n"' trivy-results.json | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No vulnerabilities reported." >> $GITHUB_STEP_SUMMARY
          fi

  trivy-container-scan:
    name: Trivy Container Image Scan (Dynamic Category)
    runs-on: ubuntu-latest
    steps:
      - name: Pull DVWA Docker Image
        run: docker pull vulnerables/web-dvwa:latest

      - name: Run Trivy Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerables/web-dvwa:latest'
          format: 'json'
          output: 'trivy-container-results.json'
          exit-code: '0'

      - name: Upload Container Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-security-report
          path: trivy-container-results.json
          retention-days: 7

      - name: Add Trivy Container Job Summary
        run: |
          echo "### 📦 Trivy Container Image Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-container-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Vulnerability ID | Package |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | "| **\(.Severity)** | `\(.VulnerabilityID)` | `\(.PkgName)` |\n"' trivy-container-results.json | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No vulnerabilities reported in image." >> $GITHUB_STEP_SUMMARY
          fi
  nmap-port-scan:
    name: Nmap Port & Service Scan (Dynamic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start DVWA Container Locally
        run: |
          docker run -d -p 80:80 --name dvwa-app vulnerables/web-dvwa:latest
          # Δίνουμε χρόνο στην εφαρμογή να ξεκινήσει πλήρως
          sleep 10 

      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Run Nmap Scan on Executing Container
        run: |
          # Εκτελούμε nmap για Service Version (-sV) και Default Scripts (-sC) 
          # στην πόρτα 80 του localhost (όπου τρέχει το DVWA)
          nmap -sV -sC -p 80 localhost -oN nmap-results.txt

      - name: Upload Nmap Report
        uses: actions/upload-artifact@v4
        with:
          name: nmap-security-report
          path: nmap-results.txt
          retention-days: 7

      - name: Add Nmap Job Summary
        run: |
          echo "### 🔍 Nmap Dynamic Port & Service Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Σάρωση της εκτελούμενης εφαρμογής DVWA για ανοιχτές θύρες και υπηρεσίες." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat nmap-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  sqlmap-dynamic-scan:
    name: SQL Injection Scan via Sqlmap (POST & In-Band)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start DVWA Container Locally
        run: |
          docker run -d -p 80:80 --name dvwa-app vulnerables/web-dvwa:latest || docker run -d -p 80:80 --name dvwa-app php:7.4-apache
          sleep 15

      - name: Initialize DVWA Database
        run: |
          # 1. Get a session cookie and extract the setup token
          SETUP_TOKEN=$(curl -s -c cookies.txt http://127.0.0.1/setup.php | awk -F"value='" '/user_token/ {print $2}' | cut -d"'" -f1)
          
          # 2. Submit the database creation request WITH the token
          curl -s -b cookies.txt -c cookies.txt -d "create_db=Create+%2F+Reset+Database&user_token=$SETUP_TOKEN" http://127.0.0.1/setup.php > /dev/null

      - name: Install Sqlmap
        run: sudo apt-get update && sudo apt-get install -y sqlmap

      - name: Run Authenticated Sqlmap Scan
        run: |
          # 1. Visit login page to grab the initial cookie and extract the CSRF token
          CSRF_TOKEN=$(curl -s -c cookies.txt http://127.0.0.1/login.php | awk -F"value='" '/user_token/ {print $2}' | cut -d"'" -f1)

          # 2. Login using the credentials AND the extracted CSRF token (FIXED UNCLOSED QUOTE & MISSING URL)
          curl -s -b cookies.txt -c cookies.txt -d "username=admin&password=password&Login=Login&user_token=$CSRF_TOKEN" http://127.0.0.1/login.php > /dev/null

          # 3. Extract PHPSESSID dynamically
          PHPSESSID=$(grep "PHPSESSID" cookies.txt | tail -n 1 | awk '{print $NF}')
          echo "Active Session Cookie: PHPSESSID=$PHPSESSID"

          # 4. Run sqlmap with POST data (FIXED EMPTY --data FLAG)
          if [ -f "endpoints.txt" ]; then
            while IFS= read -r endpoint; do
              if [[ ! -z "$endpoint" && "$endpoint" != \#* ]]; then
                echo "Testing endpoint: $endpoint"
                sqlmap -u "$endpoint" \
                  --cookie="PHPSESSID=$PHPSESSID; security=low" \
                  --data="id=1&Submit=Submit" \
                  --technique=EU \
                  --batch \
                  --risk=1 \
                  --level=1 \
                  --output-dir=sqlmap-out || true
              fi
            done < endpoints.txt
          else
            echo "endpoints.txt not found!"
          fi

      - name: Upload Sqlmap Results
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-security-report
          path: sqlmap-out/
          retention-days: 7

      - name: Add Sqlmap Job Summary
        run: |
          echo "### ⚡ Sqlmap SQL Injection Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Scan Status: **Completed (Authenticated, POST Forms, In-Band Only)**" >> $GITHUB_STEP_SUMMARY
          echo "- Target Endpoints: Checked via \`endpoints.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Sqlmap executed Error and UNION-based checks against form inputs on the running DVWA container." >> $GITHUB_STEP_SUMMARY
  zap-deep-dast-scan:
    name: Deep DAST Scan via OWASP ZAP (Bypassed Login)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start DVWA Container Locally
        run: |
          docker run -d -p 80:80 --name dvwa-app vulnerables/web-dvwa:latest || docker run -d -p 80:80 --name dvwa-app php:7.4-apache
          sleep 15

      - name: Initialize DVWA Database
        run: |
          SETUP_TOKEN=$(curl -s -c cookies.txt http://127.0.0.1/setup.php | awk -F"value='" '/user_token/ {print $2}' | cut -d"'" -f1)
          curl -s -b cookies.txt -c cookies.txt -d "create_db=Create+%2F+Reset+Database&user_token=$SETUP_TOKEN" http://127.0.0.1/setup.php > /dev/null

      - name: Bypass DVWA Login (Safe Sed)
        run: |
          echo "Safely patching DVWA..."
          # Replace the entire dvwaIsLoggedIn block with a simple return true.
          docker exec dvwa-app sed -i 's/function dvwaIsLoggedIn().*/function dvwaIsLoggedIn() { return true; }/g' /var/www/html/dvwa/includes/dvwaPage.inc.php
          
          # Force security to low without injecting variables
          docker exec dvwa-app sed -i 's/security = "high"/security = "low"/g' /var/www/html/config/config.inc.php

      - name: Verify Application is Alive
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/login.php)
          if [ "$HTTP_STATUS" -eq 500 ]; then
            echo "ERROR: The sed patch broke the application (HTTP 500). Exiting."
            exit 1
          else
            echo "SUCCESS: Application is alive (HTTP $HTTP_STATUS)."
          fi

      - name: Run ZAP Full Scan (AJAX Spider Enabled)
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:80'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-j'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-deep-scan-report
          path: report_html.html
          retention-days: 7
