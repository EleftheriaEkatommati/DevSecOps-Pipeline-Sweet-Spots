name: DevSecOps Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan & Save Report
        run: |
          gitleaks detect --source=. --report-format=json --report-path=gitleaks-results.json --verbose || true

      - name: Upload Gitleaks Results
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-security-report
          path: gitleaks-results.json
          retention-days: 7 

      - name: Add Gitleaks Job Summary with Findings
        run: |
          echo "### 🔐 Gitleaks Secret Detection Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s gitleaks-results.json ] && [ "$(cat gitleaks-results.json)" != "[]" ]; then
            echo "> ⚠️ **Warning:** Secrets or credentials detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | File | Line |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "| `\(.RuleID)` | `\(.File)` | `\(.StartLine)` |"' gitleaks-results.json | head -n 10 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ **Clean:** No secrets found in the codebase." >> $GITHUB_STEP_SUMMARY
          fi

  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config=auto --exclude=".github/workflows" --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep.sarif
          retention-days: 7

      - name: Add Semgrep Job Summary with Findings
        run: |
          echo "### 🛡️ Semgrep SAST Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s semgrep.sarif ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | File Path |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.runs[0].results[]? | "| `\(.ruleId)` | `\(.locations[0].physicalLocation.artifactLocation.uri)` |\n"' semgrep.sarif | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No findings reported." >> $GITHUB_STEP_SUMMARY
          fi

  trivy-scan:
    name: Trivy Static & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.json
          retention-days: 7

      - name: Add Trivy Job Summary with Findings
        run: |
          echo "### 🐳 Trivy Static & Config Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Vulnerability ID | Package |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | "| **\(.Severity)** | `\(.VulnerabilityID)` | `\(.PkgName)` |\n"' trivy-results.json | head -n 20 >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ No vulnerabilities reported." >> $GITHUB_STEP_SUMMARY
          fi